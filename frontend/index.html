<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Tracker</title>
  <link rel="stylesheet" href="style.css?v=103">
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="screen active">
    <div class="card">
      <h2>Welcome Back</h2>
      <a href="/login" class="btn btn-primary">Log In</a>
    </div>
  </div>

  <!-- SPLIT SCREEN -->
  <div id="split-screen" class="screen">
    <div class="card">
      <h2>Select Split</h2>
      <div class="split-options">
        <button class="split-btn" data-split="Upper Body">Upper Body</button>
        <button class="split-btn" data-split="Lower Body">Lower Body</button>
        <button class="split-btn" data-split="Custom">Custom</button>
        <button class="split-btn data-btn" data-split="Data">Data</button>
      </div>
    </div>
  </div>

  <!-- WORKOUT SCREEN -->
  <div id="workout-screen" class="screen">
    <div class="screen-header">
      <button id="back-btn" class="icon-btn">&larr; Back</button>
      <h2 id="split-title">Workout</h2>
    </div>

    <div class="exercise-controls">
      <select id="exercise-select"></select>
      <input type="text" id="custom-exercise-input" placeholder="Exercise Name..." style="display: none;">
      <button id="add-exercise-btn" class="btn btn-primary">+ Add Exercise</button>
    </div>

    <div id="exercise-list"></div>
  </div>

  <!-- DATA SCREEN -->
  <div id="data-screen" class="screen">
    <div class="screen-header">
      <button id="data-back-btn" class="icon-btn">&larr; Back</button>
      <h2>Workout Analytics</h2>
    </div>

    <div class="data-controls">
      <div class="control-group">
        <label for="data-view-filter">View:</label>
        <select id="data-view-filter">
          <option value="Table">Table View</option>
          <option value="ProgressiveOverload">Progressive Overload</option>
        </select>
      </div>

      <div class="control-group">
        <label for="data-category-filter">Category:</label>
        <select id="data-category-filter">
          <option value="All">All Splits</option>
          <option value="Upper Body">Upper Body</option>
          <option value="Lower Body">Lower Body</option>
          <option value="Custom">Custom</option>
        </select>
      </div>
    </div>

    <!-- TABLE VIEW -->
    <div id="table-view-container" class="table-container">
      <table id="workout-data-table">
        <thead>
          <tr>
            <th>Date / Time</th>
            <th>Split</th>
            <th>Exercise</th>
            <th>Set 1 (Warmup)</th>
            <th>Set 2</th>
            <th>Set 3</th>
            <th>Set 4</th>
          </tr>
        </thead>
        <tbody id="workout-data-body">
          <!-- Rows rendered dynamically via JS -->
        </tbody>
      </table>
    </div>

    <!-- PROGRESSIVE OVERLOAD VIEW -->
    <div id="overload-view-container" style="display: none;">
      <div id="overload-cards-container">
        <!-- Overload recommendation cards rendered via JS -->
      </div>
    </div>
  </div>

  <!-- EXERCISE CARD TEMPLATE -->
  <template id="exercise-template">
    <div class="exercise-card">
      <div class="card-header">
        <h3 class="exercise-name">Exercise</h3>
        <div class="card-actions">
          <button class="icon-btn collapse-toggle-btn">&#9660;</button>
          <button class="icon-btn remove-exercise-btn">&times;</button>
        </div>
      </div>
      <div class="card-body">
        <div class="set-grid">
          <div class="set-row header-row">
            <span>SET</span>
            <span>KG</span>
            <span>REPS</span>
          </div>
          <div class="set-row">
            <span>1</span>
            <input type="number" class="weight-input" placeholder="-">
            <input type="number" class="reps-input" placeholder="-">
          </div>
          <div class="set-row">
            <span>2</span>
            <input type="number" class="weight-input" placeholder="-">
            <input type="number" class="reps-input" placeholder="-">
          </div>
          <div class="set-row">
            <span>3</span>
            <input type="number" class="weight-input" placeholder="-">
            <input type="number" class="reps-input" placeholder="-">
          </div>
          <div class="set-row">
            <span>4</span>
            <input type="number" class="weight-input" placeholder="-">
            <input type="number" class="reps-input" placeholder="-">
          </div>
        </div>
        <button class="save-btn btn btn-secondary">Save</button>
      </div>
    </div>
  </template>

  <script src="script.js?v=103"></script>
</body>
</html>
