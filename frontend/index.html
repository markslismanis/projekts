<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Tracker</title>
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>

  <!-- SCREEN 0: Login gate -->
  <section id="login-screen" class="screen active">
    <div class="card">
      <h1>Workout Tracker</h1>
      <p class="subtitle">Sign in to track your workouts</p>
      <a href="/login" class="split-btn" style="display:block; text-decoration:none; text-align:center;">Sign in with Google</a>
    </div>
  </section>

  <!-- SCREEN 1: Choose split -->
  <section id="split-screen" class="screen">
    <div class="card">
      <h1>Choose Your Split</h1>
      <p class="subtitle">Pick a workout type to get started</p>
      <div class="split-options">
        <button class="split-btn" data-split="Upper Body">Upper Body</button>
        <button class="split-btn" data-split="Lower Body">Lower Body</button>
        <button class="split-btn" data-split="Custom">Custom</button>
        <button class="split-btn" data-split="Data">Data</button>
      </div>
    </div>
  </section>

  <!-- SCREEN 2: Workout log -->
  <section id="workout-screen" class="screen">
    <header class="workout-header">
      <button id="back-btn" class="back-btn">&larr; Back</button>
      <h1 id="split-title">Workout</h1>
      <a href="/logout" class="back-btn" style="margin-left:auto;">Sign Out</a>
    </header>

    <div class="add-exercise-bar">
      <select id="exercise-select"></select>
      <input id="custom-exercise-input" type="text" placeholder="Exercise name" style="display:none;">
      <button id="add-exercise-btn">+ Add Exercise</button>
    </div>

    <div id="exercise-list"></div>
  </section>

  <!-- SCREEN 3: Data -->
  <section id="data-screen" class="screen">
    <header class="workout-header">
      <button id="data-back-btn" class="back-btn">&larr; Back</button>
      <h1>Workout Data</h1>
    </header>

    <div class="data-view-toggle">
      <button id="view-table-btn" class="view-toggle-btn active" data-view="Table">Table</button>
      <button id="view-overload-btn" class="view-toggle-btn" data-view="ProgressiveOverload">Progressive Overload</button>
    </div>

    <div class="data-filter-bar">
      <select id="data-category-filter">
        <option value="All">All Splits</option>
        <option value="Upper Body">Upper Body</option>
        <option value="Lower Body">Lower Body</option>
        <option value="Custom">Custom</option>
      </select>
    </div>

    <div id="table-view-container" class="table-container">
      <table id="workout-data-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Split</th>
            <th>Exercise</th>
            <th>Set 1</th>
            <th>Set 2</th>
            <th>Set 3</th>
            <th>Set 4</th>
          </tr>
        </thead>
        <tbody id="workout-data-body"></tbody>
      </table>
    </div>

    <div id="overload-view-container" style="display:none;">
      <div id="overload-cards-container"></div>
    </div>
  </section>

  <!-- Template for one exercise block (4x2 grid: 4 sets, 2 columns) -->
  <template id="exercise-template">
    <div class="exercise-card">
      <div class="exercise-card-header">
        <button class="collapse-toggle-btn" title="Collapse / expand">
          <svg class="chevron-icon" width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M3 5L7 9L11 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <h2 class="exercise-name"></h2>
        <button class="save-btn" type="button">Save</button>
        <button class="remove-exercise-btn" title="Remove exercise">&times;</button>
      </div>
      <div class="set-grid">
        <div class="grid-label">Set</div>
        <div class="grid-label">Reps</div>
        <div class="grid-label">Weight (kg)</div>

        <div class="set-num">1</div>
        <input type="number" class="reps-input" min="0" placeholder="0">
        <input type="number" class="weight-input" min="0" step="0.5" placeholder="0">

        <div class="set-num">2</div>
        <input type="number" class="reps-input" min="0" placeholder="0">
        <input type="number" class="weight-input" min="0" step="0.5" placeholder="0">

        <div class="set-num">3</div>
        <input type="number" class="reps-input" min="0" placeholder="0">
        <input type="number" class="weight-input" min="0" step="0.5" placeholder="0">

        <div class="set-num">4</div>
        <input type="number" class="reps-input" min="0" placeholder="0">
        <input type="number" class="weight-input" min="0" step="0.5" placeholder="0">
      </div>
    </div>
  </template>

<script src="script.js?v=5"></script>
</body>
</html>
